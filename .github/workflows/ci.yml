name: CI

on:
  push:
    branches: [main, development]
  pull_request:

# A new push to the same branch/PR cancels the run that's still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Node 18 covers the built package; its development tools run on 24.
        node: ['18', '20', '22', '24']
        include:
          # Cover a second OS once, on the newest Node.
          - os: macos-latest
            node: '24'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node for development tools
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node == '18' && '24' || matrix.node }}
          cache: npm

      # `--ignore-scripts` skips any dependency postinstall scripts; there's
      # no local install-time script here, and the build below is its own
      # step with its own failure message either way.
      - run: npm ci --ignore-scripts

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:run
      - run: npm run build

      - name: Switch to Node 18 for runtime compatibility
        if: matrix.node == '18'
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Imports the built package the same way a consumer would, through
      # its "exports" field.
      - run: npm run test:lib
